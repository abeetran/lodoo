version: '3.5'
services:
  odoo:
    build:
      context: ./addons
    container_name: odoo_antesco
    networks:
      - coolify
    volumes:
      - './config/odoo.conf:/etc/odoo/odoo.conf'
      - './odoo-web-data:/var/lib/odoo'
  mcp-server:
    build:
      context: ./mcp
    container_name: mcp_server
    working_dir: /app
    command: 'bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 3333"'
    ports:
      - '3333:3333'
    networks:
      - coolify
    restart: unless-stopped
  ai-chat:
    build:
      context: ./ai-chat
    container_name: ai_chat_ui
    working_dir: /app
    command: 'sh -c "npm install && npm run dev"'
    ports:
      - '3309:3000'
    networks:
      - coolify
    restart: unless-stopped
networks:
  coolify:
    external: true
