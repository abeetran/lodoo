version: '3.5'
services:
  db:
    image: 'postgres:15'
    container_name: meworld_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-odoo}'
    volumes:
      - './postgres:/var/lib/postgresql/data'
    networks:
      - meworld
    restart: unless-stopped
  odoo:
    build:
      context: ./addons
    container_name: odoo_meworld
    ports:
      - '8069:8069'
    networks:
      - meworld
    volumes:
      - './config/odoo.conf:/etc/odoo/odoo.conf'
      # - './addons:/mnt/extra-addons/meworld'
      - './odoo-web-data:/var/lib/odoo'
networks:
  meworld:
    # external: true
